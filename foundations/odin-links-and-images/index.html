<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and images</title>
</head>
<body>
    <h1>Homepage</h1>

    <a href="https://www.theodinproject.com/about">About the Odin Project</a> <!-- This is an anchor element and prvides a link to somewhere(opens in the current tab)-->

    <a href="https://www.theodinproject.com/about" target="_blank" rel="noreferrer">About The Odin Project</a> <!-- the target attribute tells the webpage where the link will open. setting it to blank opens it in a new tab.-->

    <!-- the rel attribute describes the relationship between the page and the linked document.-->
    <!-- noreferrer prevents details about the current page being pased to the new page-->

    <a href="./pages/about.html">About</a> <!-- this is a relative link as it links to another directory within the website-->

    <img src="./images/dog.jpg" alt="a cute looking dog" height="310" width="310">
</body>
</html>
